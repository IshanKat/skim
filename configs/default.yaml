seed: 42
device: cuda

model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  load_in_4bit: true
  torch_dtype: bfloat16
  max_new_tokens: 16
  max_pixels: 200704   # 256*28*28 — caps per-frame resolution for 8GB GPU

data:
  benchmark: nextqa
  root: data/nextqa
  split: val
  max_frames: 32
  fps: 1.0
  video_dir: videos
  csv_file: val.csv
  map_file: map_vid_vidorID.json

selector:
  d_model: 512
  n_heads: 4
  n_layers: 2
  dropout: 0.1
  action_dim: 3  # keep / skip / stop
  d_vis: 1280    # Qwen2.5-VL-3B: vision encoder last_hidden_state dim
  d_text: 2048   # Qwen2.5-VL-3B: LM hidden size

env:
  horizon_is_video_len: true
  force_stop_at_end: true
  lambda_cost: 0.1
  step_penalty: 0.0

warmstart:
  target: fastv  # fastv | uniform
  epochs: 3
  batch_size: 16
  lr: 1.0e-4

ppo:
  total_episodes: 8000
  rollout_batch: 8
  ppo_epochs: 4
  lr: 3.0e-5
  kl_coef: 0.05
  entropy_coef: 0.01
  clip_range: 0.2
  gae_lambda: 0.95
  gamma: 1.0

eval:
  output_dir: results
  save_per_question_predictions: true

logging:
  use_wandb: false
  project: cs291a-afs
